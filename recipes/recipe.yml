---
# yaml-language-server: $schema=https://blue-build.org

name: n
description: A rock-solid, ultra-simple custom atomic Fedora Silverblue image.

base-image: ghcr.io/ublue-os/silverblue-main
image-version: 41

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    install:
      - fastfetch   # Simple system display tool to prove our custom image works!
